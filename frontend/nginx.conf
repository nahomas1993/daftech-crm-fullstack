server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic gzip — cheap win for JS/CSS bundle sizes.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers at the edge too — defense in depth alongside the
    # API's own SecurityHeadersExtensions (see the .NET project). 'unsafe-inline'
    # on style-src is needed because Angular injects component styles inline;
    # connect-src 'self' is sufficient since /api/ is same-origin (proxied below),
    # not a separate origin the browser needs to be allowed to call out to.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # ngsw.json and the service worker script must NEVER be cached — the
    # Angular service worker relies on always fetching the latest version of
    # these to detect updates; a stale cached copy would silently pin users
    # to an old app version indefinitely.
    location ~* ^/(ngsw\.json|ngsw-worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Hashed build assets (Angular appends content hashes to filenames) are
    # safe to cache aggressively — a new deploy produces new filenames.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback — any path not matched above (client-side routes like
    # /dashboard, /admin/dashboard, /admin/tickets, /portal/my-tickets)
    # serves index.html and lets Angular's router take over, instead of
    # nginx 404ing on a hard refresh. Deliberately NOT "$uri $uri/
    # /index.html" — the "$uri/" directory-check step is unnecessary for a
    # client-side-only router (there are no real directories to match) and
    # can misfire if a route segment ever collides with a folder name under
    # /usr/share/nginx/html. Falling straight through to /index.html for
    # anything not already served by the static-asset locations above is
    # the standard, unambiguous SPA fallback.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Reverse-proxies API calls to the backend container so the frontend's
    # environment.production.ts can keep using a relative '/api' base URL —
    # no CORS needed between the two containers since the browser only ever
    # talks to this nginx origin.
    #
    # IMPORTANT — this proxies over the public internet to the backend's
    # onrender.com hostname, NOT Docker-internal DNS. That's because the
    # two services were deployed as separate Render services (not a single
    # Blueprint from render.yaml), so they don't share a private Docker
    # network and a bare service name like "daftech-crm-api-new" does not
    # resolve. If the backend is ever recreated and its onrender.com
    # hostname changes, this value must be updated to match — check the
    # backend service's "Available at your primary URL" line in its Render
    # deploy logs, or its URL on the Render dashboard.
    #
    # The resolver + variable (rather than a bare proxy_pass to the
    # hostname) makes nginx re-resolve the backend's address on each
    # request instead of caching it once at nginx startup. 8.8.8.8 is a
    # public DNS resolver, needed here since this is a public hostname, not
    # a Docker-internal one (127.0.0.11 would not resolve it).
    resolver 8.8.8.8 valid=10s;
    location /api/ {
        set $api_upstream daftech-crm-api-n7i2.onrender.com;
        proxy_pass https://$api_upstream/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host $api_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads can be up to the API's configured max (10MB default) —
        # keep this at least that large or large uploads will be rejected by
        # nginx before they even reach the API's own size check.
        client_max_body_size 20M;
    }

    location /health {
        set $api_upstream daftech-crm-api-n7i2.onrender.com;
        proxy_pass https://$api_upstream/health;
        proxy_ssl_server_name on;
        proxy_set_header Host $api_upstream;
        proxy_set_header Host $host;
    }
}